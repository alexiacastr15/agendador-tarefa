version: '3.8'

services:
  mongo:
    image: mongo:latest
    container_name: agendador-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - mongo-data:/data/db

  app:
    build: .
    container_name: agendador-tarefas
    ports:
      - "8081:8081"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://admin:password@mongo:27017/agendador_db?authSource=admin
    depends_on:
      - mongo

volumes:
  mongo-data:
